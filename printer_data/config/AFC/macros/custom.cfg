[gcode_macro BT_EJECT_ALL]
description: Unloads and ejects all lanes
gcode:
    BT_TOOL_UNLOAD
    BT_LANE_EJECT LANE=1
    BT_LANE_EJECT LANE=2
    BT_LANE_EJECT LANE=3
    BT_LANE_EJECT LANE=4

[gcode_macro _BT_SET_DEFAULTS]
description: Sets default for BoxTurtle 
gcode:
    _BT_CLEAR_RUNOUT
    _BT_RESET_MAPPING

[gcode_macro _BT_CLEAR_RUNOUT]
description: Clears runout on all lanes
gcode:
    SET_RUNOUT LANE=lane1 RUNOUT=NONE
    SET_RUNOUT LANE=lane2 RUNOUT=NONE
    SET_RUNOUT LANE=lane3 RUNOUT=NONE
    SET_RUNOUT LANE=lane4 RUNOUT=NONE

[gcode_macro _BT_RESET_MAPPING]
description: Resets tool mappings to default
gcode:
    SET_MAP LANE=lane1 MAP=T0
    SET_MAP LANE=lane2 MAP=T1
    SET_MAP LANE=lane3 MAP=T2
    SET_MAP LANE=lane4 MAP=T3
